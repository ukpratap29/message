<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff9fb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>A small sorry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Serif+Devanagari:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="scene">
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>

        <section class="balloons" aria-hidden="true">
            <div class="balloon balloon-pink b1"><i></i></div>
            <div class="balloon balloon-clear b2"><i></i></div>
            <div class="balloon balloon-pink b3"><i></i></div>
            <div class="balloon balloon-clear b4"><i></i></div>
        </section>

        <article class="card">
            <!-- <p class="eyebrow">for you, with affection</p> -->
            <div class="rose-line" aria-hidden="true"><span>✿</span><i></i><span>✿</span></div>
            <h4>Hey Yogita</h4>
            <!-- <p class="message poem"><span class="marathi">का इतकी शांत आणि</span> katti? 🥺<br><span class="marathi">बोल
                    ना माझ्याशी आणि कर ना</span> batti. ✨<br><span class="marathi">नाही करणार मी पुन्हा अशी</span>
                maskari. 🌷</p> -->
            <button id="noteButton" type="button" aria-label="Reveal my message">with all my heart <span aria-hidden="true">↓</span></button>
            <p id="promise" class="promise" aria-live="polite">I’m genuinely sorry.</p>
        </article>

        <div class="petals" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
